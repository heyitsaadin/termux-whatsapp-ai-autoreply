plugins { id 'com.android.application' }

android {
    namespace 'com.aadin.sendkb'
    compileSdk 34
    defaultConfig {
        // new id, so it installs next to the old Send Keyboard app
        applicationId 'com.aadin.statusreply'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
