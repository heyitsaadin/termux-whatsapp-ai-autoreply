plugins { id 'com.android.application' }

android {
    namespace 'com.aadin.sendkb'
    compileSdk 36
    defaultConfig {
        applicationId 'com.aadin.statusreply'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '4.0'
    }
    signingConfigs {
        // One fixed key for every build, so a new APK installs over the old one
        // and keeps your settings. It is public on purpose: it only signs the
        // debug APK that GitHub Actions builds, never anything on a store.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 1.14 is the Material line that ships the Material 3 Expressive themes
    implementation 'com.google.android.material:material:1.14.0'
}
