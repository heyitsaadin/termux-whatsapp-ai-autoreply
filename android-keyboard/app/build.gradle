plugins { id 'com.android.application' }

android {
    namespace 'com.aadin.sendkb'
    compileSdk 36
    defaultConfig {
        applicationId 'com.aadin.statusreply'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '3.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 1.14 is the Material line that ships the Material 3 Expressive themes
    implementation 'com.google.android.material:material:1.14.0'
}
