plugins { id 'com.android.application' }

// The release workflow passes these in from the tag (v1.2.0 -> 1.2.0).
// Local and CI test builds fall back to the defaults.
def appVersionName = (project.findProperty('versionName') ?: '1.0.0').toString()
def appVersionCode = (project.findProperty('versionCode') ?: '1').toString().toInteger()

android {
    // Java package of the source files. Not shown to anyone; kept as is so the
    // source tree does not have to move.
    namespace 'com.aadin.sendkb'
    compileSdk 36
    defaultConfig {
        applicationId 'com.aadin.whatsappautomation'
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }
    signingConfigs {
        // Public debug key. It only signs the test builds from CI, so a new
        // test build installs over the old one. It is not secret on purpose.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Private release key. The Release workflow fills these in from GitHub
        // Secrets (see the README, "Releasing"). Without them the release build
        // falls back to the debug key, so forks can still build.
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks != null && !ks.isEmpty() && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig = signingConfigs.release.storeFile != null ? signingConfigs.release : signingConfigs.debug
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 1.14 is the Material line that ships the Material 3 Expressive themes
    implementation 'com.google.android.material:material:1.14.0'
}
