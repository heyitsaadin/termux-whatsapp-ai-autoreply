<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='360' viewBox='0 0 1200 360' role='img' aria-label='WhatsApp Automation: replies for you while you are busy'>
  <defs>
    <linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0' stop-color='#0f766e'/>
      <stop offset='1' stop-color='#0b3b3a'/>
    </linearGradient>
  </defs>

  <rect width='1200' height='360' rx='28' fill='url(#bg)'/>
  <circle cx='1090' cy='-20' r='190' fill='#ffffff' opacity='0.05'/>
  <circle cx='120' cy='380' r='170' fill='#ffffff' opacity='0.05'/>

  <g font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x='64' y='146' font-size='62' font-weight='800' fill='#ffffff'>WhatsApp</text>
    <text x='64' y='214' font-size='62' font-weight='800' fill='#5eead4'>Automation</text>
    <text x='64' y='262' font-size='24' fill='#ccfbf1'>Replies for you while you are busy. No server, no account.</text>

    <rect x='64' y='290' width='140' height='38' rx='19' fill='#ffffff' opacity='0.14'/>
    <text x='134' y='315' font-size='17' fill='#ffffff' text-anchor='middle'>Android 8+</text>
    <rect x='216' y='290' width='120' height='38' rx='19' fill='#ffffff' opacity='0.14'/>
    <text x='276' y='315' font-size='17' fill='#ffffff' text-anchor='middle'>Private</text>
    <rect x='348' y='290' width='150' height='38' rx='19' fill='#ffffff' opacity='0.14'/>
    <text x='423' y='315' font-size='17' fill='#ffffff' text-anchor='middle'>Open source</text>

    <g transform='translate(830 36)'>
      <rect width='310' height='288' rx='30' fill='#071a19' stroke='#2dd4bf' stroke-opacity='0.5' stroke-width='2'/>
      <circle cx='36' cy='34' r='14' fill='#14b8a6'/>
      <text x='60' y='40' font-size='18' font-weight='600' fill='#e6fffb'>Amma</text>
      <rect x='22' y='72' width='190' height='44' rx='16' fill='#1f3a38'/>
      <text x='38' y='100' font-size='17' fill='#e6fffb'>hey, are you free?</text>
      <rect x='62' y='136' width='228' height='76' rx='16' fill='#14b8a6'/>
      <text x='78' y='164' font-size='17' fill='#04201e'>Sam is at school,</text>
      <text x='78' y='190' font-size='17' fill='#04201e'>pls message later.</text>
      <rect x='22' y='232' width='266' height='36' rx='18' fill='#0d2d2b'/>
      <text x='40' y='256' font-size='14' fill='#7aa8a3'>Message</text>
    </g>
  </g>
</svg>
